name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Flip via repo variable PUBLIC_SITE_LAUNCH or Settings → Secrets and variables → Actions.
      PUBLIC_SITE_LAUNCH: ${{ vars.PUBLIC_SITE_LAUNCH || 'false' }}
      # Project site base path (kagemushyabot.github.io/projects/).
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || 'projects' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
